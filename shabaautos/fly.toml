app = "shabaautos-api"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DEMO_MODE = "false"
  SEED_DATABASE = "false"
  USE_SQLITE = "false"
  ACTIVITY_TRACKING = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/ready"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
