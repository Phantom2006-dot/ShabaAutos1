<html lang="en">

    <meta charset="UTF-8" />

    <meta name="description" content="Nigeria's premier automotive platform for buying, renting, importing, and selling verified quality vehicles." />
    <meta property="og:title" content="ShabaAutos - Buy, Rent & Import Quality Cars in Nigeria" />
    <meta property="og:description" content="Nigeria's premier automotive platform for buying, renting, importing, and selling verified quality vehicles." />
    <meta property="og:type" content="website" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <meta name="theme-color" content="#12492f" />
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('shabaautos-theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          /* Theme defaults to light when storage is unavailable. */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
